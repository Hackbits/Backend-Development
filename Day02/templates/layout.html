<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my application</title>
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;

}

body{
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 100vh;
}

nav {
    display: flex;
    padding-inline:40px;
    height: 10vh;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 0 6px 6px rgb(223, 223, 223);
    
    h1{
        font-size: 25px;
        text-transform: uppercase;
    }

    div{
        display: flex;
        gap: 4px;
    }
}
.container{
    flex: 1;
    padding: 20px 40px;
}
footer{
    text-align: center;
    padding-block: 10px;
    background-color: rgb(28, 28, 28);
    color: white;
}
    </style>
</head>
<body>
    <nav>
        <h1>logo</h1>
        <div>
            <a href="/">Home</a>
            <a href="/user/random">random user</a>
        </div>
    </nav>
    <div class="container">

        {% block content %}
        {% endblock %}
    </div>
    <footer>
        copyright to everyone
    </footer>
</body>
</html>
