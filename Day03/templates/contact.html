{% extends "base.html" %} {% block title %}Contact Us{% endblock %} {% block
content %}
<div class="row">
  <div class="col-md-6 mx-auto">
    <h2>Contact Us</h2>
    <p>Please fill out the form below to get in touch.</p>

    <form method="POST" action="{{ url_for('contact') }}">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input
          type="text"
          class="form-control"
          id="name"
          name="name"
          value="{{ name or '' }}"
          required
        />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input
          type="email"
          class="form-control"
          id="email"
          name="email"
          value="{{ email or '' }}"
          required
        />
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
</div>
{% endblock %}
